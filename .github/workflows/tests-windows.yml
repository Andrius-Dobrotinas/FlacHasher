name: Run Tests on Windows

on:
    workflow_dispatch:
    pull_request:
      branches:
        - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ./FlacHasher.sln --configuration Release
      # E2E tests are excluded here
      - name: Run Unit Tests
        run: dotnet test ./FlacHasher.sln --configuration Release --no-build --filter "FullyQualifiedName!~Andy.FlacHash.Application.Cmd.E2E"

  # E2E tests only get to run once the unit tests have proven the code sound
  e2e-tests:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install a FLAC decoder
        run: |
          Invoke-WebRequest -Uri "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.5.0-win.zip" -OutFile "$env:RUNNER_TEMP\flac.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\flac.zip" -DestinationPath "$env:RUNNER_TEMP\flac"
          "FLACHASH_TEST_DECODER=$env:RUNNER_TEMP\flac\flac-1.5.0-win\Win64\flac.exe" >> $env:GITHUB_ENV
      - name: Build
        run: dotnet build ./FlacHasher.Cmd.E2E.Tests/FlacHasher.Cmd.E2E.Tests.csproj --configuration Release
      - name: Run E2E Tests
        run: dotnet test ./FlacHasher.Cmd.E2E.Tests/FlacHasher.Cmd.E2E.Tests.csproj --configuration Release --no-build