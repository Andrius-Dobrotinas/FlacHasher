name: Run Tests on Windows

on:
    workflow_dispatch:
    pull_request:
      branches:
        - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ./FlacHasher.sln --configuration Release
      # E2E tests are excluded here
      - name: Run Unit Tests
        run: dotnet test ./FlacHasher.sln --configuration Release --no-build --filter "FullyQualifiedName!~Andy.FlacHash.Application.Cmd.E2E"