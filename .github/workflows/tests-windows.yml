name: Run Tests on Windows

on:
    workflow_dispatch:
    pull_request:
      branches:
        - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ./FlacHasher.sln --configuration Release
      - name: Run Unit Tests
        run: dotnet test ./FlacHasher.sln --configuration Release --no-build

  # E2E tests only get to run once the unit tests have proven the code sound
  e2e-tests:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Load decoder versions
        shell: pwsh
        run: |
          Get-Content decoder-versions-win.env | Where-Object { $_ -and -not $_.StartsWith('#') } | Add-Content $env:GITHUB_ENV
      - name: Install a FLAC decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:FLAC_URL -OutFile "$env:RUNNER_TEMP\flac.zip" -MaximumRetryCount 3 -RetryIntervalSec 2
          Get-Item "$env:RUNNER_TEMP\flac.zip" | Select-Object Name, Length
          $actualHash = (Get-FileHash -Path "$env:RUNNER_TEMP\flac.zip" -Algorithm SHA256).Hash
          if ($actualHash -ne $env:FLAC_SHA256) { throw "FLAC download checksum mismatch: expected $env:FLAC_SHA256, got $actualHash" }
          Expand-Archive -Path "$env:RUNNER_TEMP\flac.zip" -DestinationPath "$env:RUNNER_TEMP\flac"
          "FLACHASH_TEST_DECODER_FLAC=$env:RUNNER_TEMP\flac\flac-1.5.0-win\Win64\flac.exe" >> $env:GITHUB_ENV
      - name: Install an APE decoder (Monkey's Audio)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:APE_URL -OutFile "$env:RUNNER_TEMP\ape-setup.exe" -MaximumRetryCount 3 -RetryIntervalSec 2
          Get-Item "$env:RUNNER_TEMP\ape-setup.exe" | Select-Object Name, Length
          $actualHash = (Get-FileHash -Path "$env:RUNNER_TEMP\ape-setup.exe" -Algorithm SHA256).Hash
          if ($actualHash -ne $env:APE_SHA256) { throw "Monkey's Audio download checksum mismatch: expected $env:APE_SHA256, got $actualHash" }
          # 7-Zip is preinstalled on the windows-latest runner and available on PATH as `7z`
          7z x "$env:RUNNER_TEMP\ape-setup.exe" "-o$env:RUNNER_TEMP\ape-extracted" -y
          "FLACHASH_TEST_DECODER_APE=$env:RUNNER_TEMP\ape-extracted\MAC.exe" >> $env:GITHUB_ENV
      - name: Build
        run: dotnet build ./FlacHasher.Cmd.E2E.Tests/FlacHasher.Cmd.E2E.Tests.csproj --configuration Release
      - name: Run E2E Tests
        run: dotnet test ./FlacHasher.Cmd.E2E.Tests/FlacHasher.Cmd.E2E.Tests.csproj --configuration Release --no-build
