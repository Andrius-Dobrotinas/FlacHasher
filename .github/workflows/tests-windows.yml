name: Run Tests on Windows

on:
    workflow_dispatch:
    pull_request:
      branches:
        - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ./FlacHasher.sln --configuration Release
      - name: Run Unit Tests
        run: dotnet test ./FlacHasher.sln --configuration Release --no-build

  # E2E tests only get to run once the unit tests have proven the code sound
  e2e-tests:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install a FLAC decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.5.0-win.zip" -OutFile "$env:RUNNER_TEMP\flac.zip" -MaximumRetryCount 3 -RetryIntervalSec 2
          Get-Item "$env:RUNNER_TEMP\flac.zip" | Select-Object Name, Length
          $expectedHash = "53f1500f0d6e7c61379d7fee50d4a9f7f504c650009506d9ba015530d76c0dde"
          $actualHash = (Get-FileHash -Path "$env:RUNNER_TEMP\flac.zip" -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "FLAC download checksum mismatch: expected $expectedHash, got $actualHash" }
          Expand-Archive -Path "$env:RUNNER_TEMP\flac.zip" -DestinationPath "$env:RUNNER_TEMP\flac"
          "FLACHASH_TEST_DECODER_FLAC=$env:RUNNER_TEMP\flac\flac-1.5.0-win\Win64\flac.exe" >> $env:GITHUB_ENV
      - name: Install an APE decoder (Monkey's Audio)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://monkeysaudio.com/x64" -OutFile "$env:RUNNER_TEMP\ape-setup.exe" -MaximumRetryCount 3 -RetryIntervalSec 2
          Get-Item "$env:RUNNER_TEMP\ape-setup.exe" | Select-Object Name, Length
          # monkeysaudio.com/x64 is an unversioned "latest" link with no published checksum; hash pinned on first use below - bump it deliberately if the upstream file legitimately changes
          $expectedHash = "9941ecc7138cda99004c831df906a343b763df95819272a9dc40d1e2c127a3ad"
          $actualHash = (Get-FileHash -Path "$env:RUNNER_TEMP\ape-setup.exe" -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Monkey's Audio download checksum mismatch: expected $expectedHash, got $actualHash" }
          # 7-Zip is preinstalled on the windows-latest runner and available on PATH as `7z`
          7z x "$env:RUNNER_TEMP\ape-setup.exe" "-o$env:RUNNER_TEMP\ape-extracted" -y
          "FLACHASH_TEST_DECODER_APE=$env:RUNNER_TEMP\ape-extracted\MAC.exe" >> $env:GITHUB_ENV
      - name: Build
        run: dotnet build ./FlacHasher.Cmd.E2E.Tests/FlacHasher.Cmd.E2E.Tests.csproj --configuration Release
      - name: Run E2E Tests
        run: dotnet test ./FlacHasher.Cmd.E2E.Tests/FlacHasher.Cmd.E2E.Tests.csproj --configuration Release --no-build
