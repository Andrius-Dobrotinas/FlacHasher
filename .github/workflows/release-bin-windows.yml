# Builds and Releases a selected application (CMD or GUI), zipped.
# For now, as a draft.

name: Release the Compiled Application (Draft for now)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Application to release"
        required: true
        type: choice
        options:
          - cmd
          - gui
      runtime:
        description: "Runtime identifier"
        required: true
        type: choice
        options:
          - win-x64
          - win-x86
          - win-arm64

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # required for tag and release creation
    steps:
      - uses: actions/checkout@v4

      - name: Determine inputs
        id: determine-project
        shell: bash
        env:
          INPUT_PROJECT: ${{ github.event.inputs.project }}
        run: |
          echo "Application: \`${INPUT_PROJECT}\`" >> $GITHUB_STEP_SUMMARY

          if [[ "$INPUT_PROJECT" == "cmd" ]]; then
            echo "project_dir=FlacHasher.Cmd" >> $GITHUB_OUTPUT
            echo "name=flachasher-cmd" >> $GITHUB_OUTPUT
            echo "exe=FlacHasher.exe" >> $GITHUB_OUTPUT
          else
            echo "project_dir=FlacHasher.Win" >> $GITHUB_OUTPUT
            echo "name=flachasher-gui" >> $GITHUB_OUTPUT
            echo "exe=FlacHasherUI.exe" >> $GITHUB_OUTPUT
          fi

      - name: Determine tag
        id: determine-tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "draft-" + (Get-Date -Format "yyyyMMdd-HHmmss")
          }
          "tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: "Summary: tag"
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.determine-tag.outputs.tag }}
        run: |
          echo "Version: \`${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY

      # Assembly and file versions must be numeric, so they're taken from the tag only when it looks like a version number (e.g. "v1.2.3"),
      # and fall back to 0.0.0 otherwise. The informational version is free-form, so it always carries the actual tag plus the commit it was built from.
      - name: Determine version
        id: determine-version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.determine-tag.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG

          $match = [regex]::Match($tag, '^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$')
          if ($match.Success) {
            $version = "$($match.Groups[1].Value).$($match.Groups[2].Value).$($match.Groups[3].Value)"
            if ($match.Groups[4].Success) {
              $version = "$version.$($match.Groups[4].Value)"
            }
          } else {
            $version = "0.0.0"
          }

          $informational = "$tag+$($env:GITHUB_SHA.Substring(0, 7))"

          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          "informational=$informational" | Out-File -Append $env:GITHUB_OUTPUT

          "Assembly version: ``$version``" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "Informational version: ``$informational``" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Determine zip filename
        id: zip-filename
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.determine-project.outputs.name }}
          RELEASE_TAG: ${{ steps.determine-tag.outputs.tag }}
          INPUT_RUNTIME: ${{ github.event.inputs.runtime }}
        run: echo "filename=${PROJECT_NAME}-${RELEASE_TAG}-${INPUT_RUNTIME}.zip" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        env:
          PROJECT_DIR: ${{ steps.determine-project.outputs.project_dir }}
          INPUT_RUNTIME: ${{ github.event.inputs.runtime }}
          VERSION: ${{ steps.determine-version.outputs.version }}
          INFORMATIONAL_VERSION: ${{ steps.determine-version.outputs.informational }}
        run: dotnet publish ./$env:PROJECT_DIR/ -c Release -r $env:INPUT_RUNTIME --output ./out -p:Version=$env:VERSION "-p:InformationalVersion=$env:INFORMATIONAL_VERSION"
      
      - name: Verify publish output
        shell: pwsh
        env:
          EXE_NAME: ${{ steps.determine-project.outputs.exe }}
        run: |
          $exePath = Join-Path './out' $env:EXE_NAME
          if (-not (Test-Path -Path $exePath -PathType Leaf)) {
            Write-Error "Expected executable '$env:EXE_NAME' was not found in the publish output directory './out'. The build may have failed or produced unexpected output."
            exit 1
          }

      - name: Zip bins
        shell: pwsh
        env:
          ZIP_FILENAME: ${{ steps.zip-filename.outputs.filename }}
        run: Compress-Archive -Path ./out/* -DestinationPath ./$env:ZIP_FILENAME -Force 

      - name: Generate checksum
        shell: pwsh
        env:
          ZIP_FILENAME: ${{ steps.zip-filename.outputs.filename }}
        run: |
          $filename = $env:ZIP_FILENAME
          $hash = (Get-FileHash "./$filename" -Algorithm SHA256).Hash.ToLower()
          "$hash  $filename" | Out-File "./${filename}.sha256" -Encoding utf8NoBOM
      
      - name: Upload release
        id: upload-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine-tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{steps.zip-filename.outputs.filename}}
            ${{steps.zip-filename.outputs.filename}}.sha256
          draft: true
      
      - name: Add the Report to the Summary
        shell: bash
        env:
          UPLOAD_URL: ${{ steps.upload-release.outputs.url }}
        run: |
          echo "### Release Uploaded" >> $GITHUB_STEP_SUMMARY
          
          uploadUrl=$UPLOAD_URL
          echo "[${uploadUrl}](${uploadUrl})" >> $GITHUB_STEP_SUMMARY