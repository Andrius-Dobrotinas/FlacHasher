# Builds and Releases a selected application (CMD or GUI), zipped.
# For now, as a draft.

name: Release the Compiled Application (Draft for now)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Application to release"
        required: true
        type: choice
        options:
          - cmd
          - gui
      runtime:
        description: "Runtime identifier"
        required: true
        type: choice
        options:
          - win-x64
          - win-x86
          - win-arm64

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # required for tag and release creation
    steps:
      - uses: actions/checkout@v4

      - name: Determine inputs
        id: determine-project
        shell: bash
        run: |
          echo "Application: \`${{github.event.inputs.project}}\`" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event.inputs.project }}" == "cmd" ]]; then
            echo "project_dir=FlacHasher.Cmd" >> $GITHUB_OUTPUT
            echo "name=flachasher-cmd" >> $GITHUB_OUTPUT
          else
            echo "project_dir=FlacHasher.Win" >> $GITHUB_OUTPUT
            echo "name=flachasher-gui" >> $GITHUB_OUTPUT
          fi

      - name: Determine tag
        id: determine-tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "draft-" + (Get-Date -Format "yyyyMMdd-HHmmss")
          }
          "tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: "Summary: tag"
        shell: bash
        run: |
          echo "Version: \`${{ steps.determine-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Determine zip filename
        id: zip-filename
        shell: bash
        run: echo "filename=${{ steps.determine-project.outputs.name }}-${{ steps.determine-tag.outputs.tag }}-${{ github.event.inputs.runtime }}.zip" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet publish ./${{ steps.determine-project.outputs.project_dir }}/ -c Release -r ${{ github.event.inputs.runtime }} --output ./out
      
      - name: Verify publish output
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path ./out -Filter *.exe
          if ($exeFiles.Count -eq 0) {
            Write-Error "No .exe files found in the publish output directory './out'. The build may have failed or produced unexpected output."
            exit 1
          }

      - name: Zip bins
        shell: pwsh
        run: Compress-Archive -Path ./out/* -DestinationPath ./${{steps.zip-filename.outputs.filename}} -Force 

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./${{steps.zip-filename.outputs.filename}} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{steps.zip-filename.outputs.filename}}" | Out-File ./${{steps.zip-filename.outputs.filename}}.sha256 -Encoding utf8NoBOM
      
      - name: Upload release
        id: upload-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine-tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{steps.zip-filename.outputs.filename}}
            ${{steps.zip-filename.outputs.filename}}.sha256
          draft: true
      
      - name: Add the Report to the Summary
        shell: bash
        run: |
          echo "### Release Uploaded" >> $GITHUB_STEP_SUMMARY
          
          uploadUrl=${{ steps.upload-release.outputs.url}}
          echo "[${uploadUrl}](${uploadUrl})" >> $GITHUB_STEP_SUMMARY