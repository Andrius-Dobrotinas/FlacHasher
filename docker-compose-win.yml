services:
  tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0-nanoserver-ltsc2022
    working_dir: "c:\\src"
    entrypoint:
     - dotnet
    command:
     - test
     - FlacHasher.sln
     - --configuration
     - Release
     - /p:EnableWindowsTargeting=true
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      # Use a different output folder - so it doesn't clash with the host's builds
      # Put the build files on the host it gets reused between the `docker-compose run` in Workflow steps
      UseArtifactsOutput: "true"
      ArtifactsPath: "c:\\src\\build-output"
    volumes:
      - type: bind
        source: .
        target: "c:\\src"

  # Each test project writes a report in HTML
  tests_report:
    extends:
      service: tests
    # "/c" is a requirement for Cmd to execute run-tests-w-report.cmd
    entrypoint: ["cmd", "/c"]
    command:
      - run-tests-w-report.cmd